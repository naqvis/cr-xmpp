name: cr-xmpp

services:
  prosody:
    image: prosodyim/prosody:13.0@sha256:e44a7dfedb776c8945b5c6401a3437a009b549923f7bbcb5a480c2de5f86e5d7
    ports:
      - "${XMPP_PORT:-5222}:5222"
      - "${XMPP_COMPONENT_PORT:-5347}:5347"
    volumes:
      - ./docker/prosody/prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro
      - ./docker/prosody/certs:/etc/prosody/certs:ro
      - ./docker/prosody/modules:/usr/local/lib/prosody/site-modules:ro
      - prosody-data:/var/lib/prosody
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5222"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: unless-stopped

volumes:
  prosody-data:
